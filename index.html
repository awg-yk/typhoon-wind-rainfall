<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台風データマップ | 1975-2025年 上陸台風</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --ink:#0b1622;
  --panel:#101f30;
  --panel-2:#16283d;
  --line:#25405c;
  --paper:#e9e4d6;
  --amber:#e0913a;
  --amber-bright:#f4b45c;
  --red:#c1503f;
  --teal:#5fa3a3;
  --rain:#6f8fe0;
  --text:#e9e4d6;
  --text-dim:#9db2c4;
  --mono: "JetBrains Mono","SFMono-Regular",Consolas,monospace;
  --serif: "Shippori Mincho","Noto Serif JP",serif;
  --sans: "Zen Kaku Gothic New","Noto Sans JP",sans-serif;
}
* { box-sizing:border-box; }
html,body{
  margin:0; padding:0; height:100%;
  background:var(--ink); color:var(--text);
  font-family:var(--sans);
  overflow:hidden;
}
@font-face{ }
#app{ display:flex; flex-direction:column; height:100vh; }

/* ===== Header ===== */
header{
  display:flex; align-items:baseline; gap:18px;
  padding:14px 22px 10px 22px;
  background:linear-gradient(180deg,var(--panel),var(--ink));
  border-bottom:1px solid var(--line);
  flex-shrink:0;
}
header h1{
  font-family:var(--serif);
  font-size:20px; font-weight:600; letter-spacing:.04em;
  margin:0; color:var(--paper);
}
header .sub{
  font-family:var(--mono); font-size:11px; color:var(--text-dim);
  letter-spacing:.03em;
}
header .spacer{ flex:1; }
.badge{
  font-family:var(--mono); font-size:10px; color:var(--text-dim);
  border:1px solid var(--line); padding:3px 8px; border-radius:2px;
  letter-spacing:.05em;
}

/* ===== Storm picker (year dropdown -> storm dropdown) ===== */
#picker{ margin-bottom:14px; }
#picker-cols{ display:flex; gap:6px; }
#year-select, #storm-select{
  font-family:var(--mono); font-size:12px; background:var(--panel-2); color:var(--text-dim);
  border:1px solid var(--line); border-radius:3px; padding:6px 8px;
}
#year-select{ width:90px; flex-shrink:0; }
#storm-select{ flex:1; min-width:0; }

/* ===== Filter ===== */
#filter-section{
  font-family:var(--mono); font-size:11px; color:var(--text-dim);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-bottom:14px;
}
#filter-section label{ display:flex; align-items:center; gap:4px; cursor:pointer; }
#filter-count{ color:var(--amber-bright); }

/* ===== Body layout ===== */
#body{ flex:1; display:flex; min-height:0; position:relative; }
#map{ flex:1; min-width:0; background:#0a1420; position:relative; }

/* Legend, floated small over the map's bottom-right corner. Readout and
   the min-value filter live in the left nav panel; About is behind the
   "i" button instead of taking up permanent space. */
#mapinfo{
  position:absolute; right:16px; bottom:16px; z-index:1000;
  width:240px; max-height:calc(100% - 32px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:10px 12px; box-shadow:0 2px 12px rgba(0,0,0,.35);
}
#mapinfo .section-label{ margin-bottom:6px; }
@media (max-width: 860px){
  #mapinfo{ position:static; width:auto; max-height:none; margin:12px 18px; }
}

#topright{
  position:absolute; right:16px; top:16px; z-index:1000;
  display:flex; flex-direction:column; align-items:flex-end; gap:8px;
}
#about-btn{
  width:24px; height:24px; border-radius:50%; flex-shrink:0;
  background:var(--panel); color:var(--teal); border:1px solid var(--line);
  font-family:var(--serif); font-style:italic; font-size:13px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 12px rgba(0,0,0,.35);
}
#about-btn:hover{ color:var(--amber-bright); }
#about-popover{
  display:none;
  position:absolute; right:16px; top:48px; z-index:1000;
  width:260px; background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:12px 14px; box-shadow:0 2px 12px rgba(0,0,0,.35);
  font-size:11px; line-height:1.7; color:var(--text-dim);
}
#about-popover.open{ display:block; }

#ranking-panel{
  width:280px; max-height:min(50vh, 420px); overflow-y:auto;
  background:var(--panel); border:1px solid var(--line); border-radius:4px;
  padding:10px 12px; box-shadow:0 2px 12px rgba(0,0,0,.35);
}
#ranking-panel .section-label{ margin-bottom:6px; }
.ranking-table{ width:100%; border-collapse:collapse; font-size:11px; color:var(--text-dim); }
.ranking-table td{ padding:3px 4px; border-top:1px solid var(--line); white-space:nowrap; }
.ranking-table tr:first-child td{ border-top:none; }
.ranking-table .rank{ color:var(--amber-bright); font-weight:700; width:1.4em; }
.ranking-table .name{ color:var(--paper); width:100%; overflow:hidden; text-overflow:ellipsis; }
.ranking-table .pref{ display:block; color:var(--text-dim); font-size:9px; font-weight:400; }
.ranking-table .val{ text-align:right; font-weight:600; color:var(--paper); }
.ranking-table .time{ text-align:right; color:var(--text-dim); font-size:10px; }
.leaflet-container{ background:#0a1420; }
/* Dark map look matched to reference (typhoon_track_finder.html):
   invert the light GSI "pale" tiles and re-tint them. */
.leaflet-tile-pane{ transition: filter .2s; }
#map.dark-tiles .leaflet-tile-pane{
  filter: invert(92%) hue-rotate(180deg) brightness(0.92) contrast(0.92) saturate(0.9);
}

/* Left info+navigation panel (picker, filter, storm details) */
#leftpanel{
  width:300px; flex-shrink:0; background:var(--panel);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; overflow-y:auto;
  padding:16px 18px 18px 18px;
}

/* Narrow screens: #map has a hard floor below which it becomes unusable, so
   below that width stack the map below the left panel instead of squeezing
   them side-by-side (which used to push the panel, and its mode-toggle
   button, partly or fully out of view). */
@media (max-width: 860px){
  #body{ flex-direction:column; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #map{ flex:none; width:100%; height:46vh; min-height:260px; }
  #leftpanel{
    width:100%; flex-shrink:0; overflow-y:visible;
    border-right:none; border-bottom:1px solid var(--line);
  }
}
#leftpanel h2{
  font-family:var(--serif); font-size:15px; margin:0 0 2px 0; color:var(--paper);
  letter-spacing:.02em;
}
#leftpanel .storm-en{ font-family:var(--mono); font-size:11px; color:var(--text-dim); margin-bottom:14px; }

.readout{
  display:grid; grid-template-columns:auto auto; gap:3px 10px;
  font-family:var(--mono); font-size:12px; margin-bottom:16px;
}
.readout .k{ color:var(--text-dim); }
.readout .v{ color:var(--paper); text-align:right; font-weight:600; }
.readout .v.big{ font-size:22px; color:var(--amber-bright); }

#damage-info{
  margin-top:8px; padding:8px 10px;
  background:var(--panel-2); border:1px solid var(--line); border-radius:3px;
  font-family:var(--mono); font-size:11px; line-height:1.7;
}
#damage-info .title{ color:#e0793a; letter-spacing:.08em; text-transform:uppercase; font-size:10px; margin-bottom:3px; }
#damage-info .row{ display:flex; justify-content:space-between; gap:8px; }
#damage-info .row .k{ color:var(--text-dim); }
#damage-info .row .v{ color:var(--paper); font-weight:600; }
#damage-info .note{ margin-top:6px; padding-top:6px; border-top:1px solid var(--line); color:var(--text-dim); font-size:10px; line-height:1.6; }
#damage-info .note summary{ cursor:pointer; color:var(--teal); font-family:var(--mono); font-size:10px; letter-spacing:.04em; margin-bottom:4px; }
#damage-info .note summary:hover{ color:var(--amber-bright); }
#damage-info .pref-map{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
#damage-info .pref-map svg{ width:100%; max-width:220px; display:block; margin:0 auto; }
#damage-info .pref-map-legend{ font-size:9px; color:var(--text-dim); text-align:center; margin-top:4px; }

hr.rule{ border:none; border-top:1px solid var(--line); margin:12px 0; }

#legend-wind{ font-size:11px; color:var(--text-dim); line-height:1.3; }
#legend-wind .row{ display:flex; align-items:center; gap:6px; margin-bottom:1px; }
#legend-wind svg{ flex-shrink:0; }
#legend-wind .jma-label{ color:var(--text-dim); opacity:.75; margin-left:2px; }

#threshold-control{ display:flex; align-items:center; gap:10px; }
#threshold-control input[type="range"]{ flex:1; accent-color:var(--amber); }
.threshold-value{ font-size:11px; color:var(--text-dim); white-space:nowrap; min-width:88px; text-align:right; }

.section-label{
  font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--teal); margin:0 0 8px 0;
}

/* ===== Bottom timeline ===== */
/* Grid (not two independently-flexed rows) so the tick labels line up under
   the slider's actual left/right edges instead of guessing their offset
   with a fixed padding-left -- the play button and time label don't have a
   fixed combined width (time-label's is a min-width, not a width), so any
   fixed-offset approach drifts out of alignment. */
#timebar{
  flex-shrink:0; background:var(--panel-2); border-top:1px solid var(--line);
  padding:10px 22px 14px 22px;
  display:grid;
  grid-template-columns: auto auto 1fr auto;
  column-gap:14px; row-gap:8px;
  align-items:center;
}
#play-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--line);
  background:var(--panel); color:var(--amber-bright); cursor:pointer;
  display:flex; align-items:center; justify-content:center; font-size:14px;
  flex-shrink:0;
}
#play-btn:hover{ border-color:var(--amber); }
#play-btn:disabled, #slider:disabled{ opacity:.35; cursor:not-allowed; }
#time-label{
  font-family:var(--mono); font-size:13px; color:var(--paper); min-width:170px;
}
#speed-select{
  font-family:var(--mono); font-size:11px; background:var(--panel); color:var(--text-dim);
  border:1px solid var(--line); padding:4px 6px; border-radius:2px;
}
#slider{
  width:100%; -webkit-appearance:none; appearance:none; height:3px; background:var(--line);
  border-radius:2px; outline:none;
}
#slider::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:12px; height:12px; border-radius:50%;
  background:var(--amber-bright); cursor:pointer; border:2px solid var(--ink);
}
#slider::-moz-range-thumb{
  width:12px; height:12px; border-radius:50%; background:var(--amber-bright); cursor:pointer; border:2px solid var(--ink);
}
#ticklabels{
  grid-column: 3; grid-row: 2;
  display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--text-dim);
}

/* Wind arrow marker */
.wind-arrow{ pointer-events:none; }

.mode-toggle{
  display:flex; gap:0; margin:10px 0 4px 0; border:1px solid var(--line);
  border-radius:3px; overflow:hidden;
}
#mode-nodata-note{
  font-size:11px; color:var(--text-dim); background:var(--panel-2);
  border:1px solid var(--line); border-radius:3px; padding:6px 8px;
  margin-bottom:10px;
}
.mode-btn{
  flex:1; font-family:var(--mono); font-size:11px; letter-spacing:.03em;
  padding:7px 6px; background:var(--panel-2); color:var(--text-dim);
  border:none; cursor:pointer; transition:background .15s,color .15s;
}
.mode-btn + .mode-btn{ border-left:1px solid var(--line); }
.mode-btn:hover{ color:var(--text); }
.mode-btn.active[data-mode="wind"]{ background:var(--amber); color:var(--ink); }
.mode-btn.active[data-mode="rain"]{ background:var(--rain); color:var(--ink); }

.ty-mark-wrap{ pointer-events:none; }
.ty-mark{
  display:flex; flex-direction:column; align-items:center; line-height:1.15;
  white-space:nowrap; font-family:var(--mono);
}
.ty-mark .ty-pres{
  font-size:10px; font-weight:700; color:#fff;
  text-shadow:0 0 3px #000, 0 0 3px #000, 0 0 3px #000, 0 1px 1px #000;
}
.ty-mark .ty-code{
  font-size:16px; font-weight:900; color:#e5342a; letter-spacing:.02em;
  text-shadow:0 0 3px #000, 0 0 3px #000, 0 0 3px #000, 0 1px 1px #000;
}
.typhoon-eye{ pointer-events:none; }

.isobar-label{
  pointer-events:none; font-family:var(--mono); font-size:10px; font-weight:700;
  color:#fff; text-align:center; line-height:14px;
  text-shadow:0 0 3px #000, 0 0 3px #000, 0 1px 1px #000;
}

.leaflet-tooltip{
  background:var(--panel); color:var(--text); border:1px solid var(--line);
  border-radius:3px; font-family:var(--mono); font-size:11px; line-height:1.5;
  padding:4px 7px; box-shadow:none;
}
.leaflet-tooltip-top:before{ border-top-color:var(--line); }

.leaflet-popup-content-wrapper{
  background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:3px;
}
.leaflet-popup-tip{ background:var(--panel); }
.leaflet-popup-content{ font-family:var(--mono); font-size:11px; margin:8px 10px; }
.leaflet-control-zoom a{ background:var(--panel) !important; color:var(--text) !important; border-color:var(--line) !important; }
.leaflet-control-attribution{
  background:rgba(15,23,32,.85) !important; color:var(--text-dim) !important;
  font-size:10px !important;
}
.leaflet-control-attribution a{ color:var(--teal) !important; }

#credit{
  position:absolute; bottom:6px; left:6px; z-index:500;
  font-family:var(--mono); font-size:9px; color:rgba(233,228,214,.35);
  background:rgba(11,22,34,.55); padding:2px 6px; border-radius:2px; pointer-events:none;
}

#loading-overlay{
  position:fixed; inset:0; z-index:9999;
  display:flex; align-items:center; justify-content:center;
  background:var(--ink); color:var(--text-dim);
  font-family:var(--mono); font-size:13px; letter-spacing:.05em;
}
</style>
</head>
<body>
<div id="app">

  <header>
    <h1>台風データマップ</h1>
    <div class="sub" id="header-sub">上陸台風 &mdash; 地上風観測データ</div>
    <div class="spacer"></div>
    <div class="badge">国土地理院地図</div>
  </header>

  <div id="body">
    <div id="leftpanel">
      <div id="filter-section">
        <label><input type="checkbox" id="f-landfall" checked>上陸・通過や被害のあった台風のみ</label>
        <span id="filter-count"></span>
      </div>

      <div id="picker">
        <div id="picker-cols">
          <select id="year-select"><option value="">年を選択</option></select>
          <select id="storm-select" style="display:none"></select>
        </div>
      </div>

      <hr class="rule">

      <h2 id="side-name-ja">年と台風を選択してください</h2>
      <div class="storm-en" id="side-name-en">&nbsp;</div>

      <div class="readout" id="readout">
        <div class="k">日時</div><div class="v" id="v-time">&mdash;</div>
        <div class="k">中心気圧</div><div class="v big" id="v-pres">&mdash;</div>
        <div class="k">階級</div><div class="v" id="v-grade">&mdash;</div>
        <div class="k">位置</div><div class="v" id="v-pos">&mdash;</div>
      </div>
      <div id="damage-info" style="display:none;"></div>

      <hr class="rule">
      <div class="mode-toggle" id="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="wind">風 Wind</button>
        <button type="button" class="mode-btn" data-mode="rain">雨 Rain</button>
      </div>
      <div id="mode-nodata-note" style="display:none;"></div>

      <div class="section-label" id="threshold-title">Min Value Filter / 最小値フィルタ</div>
      <div id="threshold-control">
        <input type="range" id="threshold-slider" min="0" max="30" step="1" value="0">
        <div id="threshold-value" class="threshold-value"></div>
      </div>
    </div>
    <div id="map"></div>
    <div id="mapinfo">
      <div class="section-label" id="legend-title">Wind Legend / 風の凡例</div>
      <div id="legend-wind"></div>
    </div>
    <div id="topright">
      <button type="button" id="about-btn" title="About">i</button>
      <div id="ranking-panel" style="display:none;"></div>
    </div>
    <div id="about-popover">
      「風」表示では矢印が風の吹いていく方向、長さと色が風速(m/s)を表します。「雨」表示では丸の大きさと色が1時間降水量(mm)を表します。台風の中心（赤文字のTD/TS/STS/T/L）は気象庁ベストトラックに基づき、上に中心気圧を表示します。経路線は、実線（オレンジ）が通過済み、破線（水色）がこの後進む経路です。
    </div>
  </div>

  <div id="timebar">
    <button id="play-btn" disabled>&#9654;</button>
    <div id="time-label">&mdash;</div>
    <input id="slider" type="range" min="0" max="0" value="0" step="1" disabled>
    <select id="speed-select">
      <option value="300">速い</option>
      <option value="600" selected>標準</option>
      <option value="1000">遅い</option>
    </select>
    <div id="ticklabels"></div>
  </div>
  <div id="loading-overlay">データ読み込み中 &hellip;</div>

</div>

<script>
(function(){
"use strict";
const DATA = { stationNames: [], stationCoords: [], storms: {}, pressure: {}, network: { wind: [], rain: [] }, obsNet: {}, tydbDamage: {} };
let STORM_META = {};   // code -> {name, year}, from data/index.json (tiny, loaded up front)
let STORM_ORDER = [];
// JMA best-track "階級" (grade) codes:
//   2, 9 = 熱帯低気圧 (Tropical Depression)
//   3    = 台風 (Tropical Storm)
//   4    = 台風 (Severe Tropical Storm)
//   5    = 台風 (Typhoon)
//   6    = 温帯低気圧 (extratropical low)
//   7    = RSMC東京の監視区域に入ったことを示すコード（強度分類ではない）
//   1, 8 = 通常使用しない
const GRADE_LABEL = {
  "2":"Tropical Depression(熱帯低気圧)",
  "9":"Tropical Depression(熱帯低気圧)",
  "3":"Tropical Storm(台風)",
  "4":"Severe Tropical Storm(台風)",
  "5":"Typhoon(台風)",
  "6":"温帯低気圧",
  "7":"熱帯低気圧"
};

function gradeCode(grade){
  // Short red label drawn at the storm center on the map.
  switch(grade){
    case '2': case '9': return 'TD';
    case '3': return 'TS';
    case '4': return 'STS';
    case '5': return 'T';
    case '6': return 'L';
    default: return grade; // rare/unused codes (1, 7, 8): show the raw code rather than guessing
  }
}

let map, tyMarker, trackLine, trackPastLine, trackHitLine, isobarLayer;
let windLayer = []; // array of {marker, station index} -- legacy 156-station network
let netWindLayer = []; // AMeDAS network (976 stations), shown when a storm has data/storms_obs/<code>_wind.json
let netRainLayer = []; // AMeDAS network (1669 stations), shown when a storm has data/storms_obs/<code>_rain.json
let displayMode = 'wind'; // 'wind' | 'rain'
const modeHasData = { wind: false, rain: false }; // per-mode data availability for the current storm
const ranking = { wind: [], rain: [] }; // top-10 {name,time,value} for the current storm, per mode
// The timeline (slider/ticks/playback) follows whichever times axis backs
// the currently displayed mode -- see activeTimeline(). Recomputed on
// storm select and on mode switch (wind/rain can have different cadences).
let activeTimes = [];
let activePlayIdx = [];
// Per-mode minimum-value filter (m/s for wind, mm/h for rain): markers below
// this are skipped entirely (no icon rebuilt) to keep frame updates cheap
// when a storm's AMeDAS network data has hundreds of near-zero stations.
const displayThreshold = { wind: 0, rain: 0 };
let currentStormCode = null;
let currentIdx = 0;
let playing = false;
let playTimer = null;
let selectToken = 0; // guards against out-of-order async storm loads (fast tab clicking)

function computeStormOrder(){
  // Sort by year, then by storm number (the last 2 digits of the code),
  // not by track start time: some storms' track data begins a day or two
  // before their nominal number would suggest (e.g. 7506's track starts
  // before 7505's), which would otherwise show a later-numbered storm
  // ahead of an earlier one.
  return Object.keys(STORM_META).sort(function(a,b){
    const sa = STORM_META[a], sb = STORM_META[b];
    const ya = parseInt(sa.year, 10), yb = parseInt(sb.year, 10);
    if (ya !== yb) return ya - yb;
    const na = parseInt(a.slice(2), 10), nb = parseInt(b.slice(2), 10);
    return na - nb;
  });
}

async function loadStations(){
  // Station list/coords: tiny (~4KB), needed before the map can be built.
  const res = await fetch('data/stations.json');
  if (!res.ok) throw new Error('stations.json: ' + res.status);
  const j = await res.json();
  DATA.stationNames = j.stationNames;
  DATA.stationCoords = j.stationCoords;
}

async function loadIndex(){
  // Lightweight per-storm metadata (name/year only, ~5KB total) so tabs and
  // the dropdown can be built without downloading every storm's full track
  // and wind data up front.
  const res = await fetch('data/index.json');
  if (!res.ok) throw new Error('index.json: ' + res.status);
  STORM_META = await res.json();
}

let DAMAGE_INFO = {}; // code -> {rank,name,deadOrMissing,injured,houseDamage,floodDamage,costOkuYen}

async function loadDamageInfo(){
  // Digital Typhoon disaster-database ranking (see data/damage_storm_codes.json
  // for source/methodology) -- optional, so a missing/failed fetch just
  // means no damage panel is shown, not a load error for the whole app.
  try {
    const res = await fetch('data/damage_storm_codes.json');
    if (!res.ok) return;
    const j = await res.json();
    (j.codes || []).forEach(function(e){ DAMAGE_INFO[e.code] = e; });
  } catch (err) { /* optional data -- ignore */ }
}

let PREFECTURES_GEO = null; // [{id, kanji, path}] SVG path per prefecture, for the damage choropleth

async function loadNetworkStations(){
  // Expanded AMeDAS+気象台等 observation network (976 wind stations, 1669
  // rain stations -- separate lists since not every station reports both).
  // ~480KB, loaded up front alongside the legacy 156-station list so both
  // marker layers can be pre-built in initMap().
  const res = await fetch('data/stations_network.json');
  if (!res.ok) throw new Error('stations_network.json: ' + res.status);
  DATA.network = await res.json();
}

async function loadStormObsNetwork(code){
  // Per-storm AMeDAS network wind/rain (data/storms_obs/<code>_{wind,rain}.json),
  // fetched on demand and cached. Not every storm has this yet (fetched
  // separately, storm by storm); a 404 on either file just means that half
  // (or all) of it isn't available, handled as null so callers fall back to
  // the legacy 156-station data embedded in data/storms/<code>.json.
  if (Object.prototype.hasOwnProperty.call(DATA.obsNet, code)) return DATA.obsNet[code];
  const fetchOne = function(kind){
    return fetch('data/storms_obs/' + code + '_' + kind + '.json')
      .then(function(res){ return res.ok ? res.json() : null; })
      .catch(function(){ return null; });
  };
  const [wind, rain] = await Promise.all([fetchOne('wind'), fetchOne('rain')]);
  const obs = (wind || rain) ? { wind: wind, rain: rain } : null;
  DATA.obsNet[code] = obs;
  return obs;
}

async function loadStorm(code){
  // Full track + wind payload for one storm, fetched on demand (only when
  // that storm is actually selected) and cached in DATA.storms thereafter.
  if (DATA.storms[code]) return DATA.storms[code];
  const res = await fetch('data/storms/' + code + '.json');
  if (!res.ok) throw new Error('storms/' + code + '.json: ' + res.status);
  const s = await res.json();
  if (!s.times || !s.wind || !s.rain){
    // Track-only storm (no station observation data): synthesize a "times"
    // axis from the track itself (JST, matching the +9h convention used for
    // storms that do have observations) so the shared playback code can
    // treat it like any other storm, just with empty wind/rain arrays.
    //
    // IMPORTANT: format with isoLocal (local Date getters), not
    // toISOString() (UTC getters). Every timestamp string in this file is
    // parsed elsewhere via Date.parse()/`new Date(str)`, which -- per the
    // ES2015 Date Time String spec -- treats a string with no timezone
    // designator as the *browser's local time*, not UTC. trackTimeMs()
    // relies on that: it does Date.parse(track.time) + 9h, and everything
    // downstream (getPlayableIndices, the past/future track split, etc.)
    // re-parses these synthesized s.times the same way, so the round trip
    // only reproduces the intended epoch if the string's digits are also
    // local-getter digits. toISOString() emits UTC-getter digits instead,
    // which silently disagrees with trackTimeMs() by the viewer's UTC
    // offset -- for JST viewers that made the last few hours of every
    // track-only storm fail the getPlayableIndices() bounds check, so
    // playback (and the past/future track line split) stopped short of
    // the storm's actual last track point.
    s.times = s.track.map(function(p){
      return isoLocal(new Date(Date.parse(p.time) + 9*3600*1000));
    });
    s.wind = [];
    s.rain = [];
    s.noObs = true;
  }
  DATA.storms[code] = s;
  return s;
}

async function loadPressureData(code){
  // JRA-3Q sea-level pressure grid for isobar drawing, overlaid on the
  // wind/rain markers whenever available. Not every storm has this (only
  // landfallJP storms were downloaded, and a few months' source data may
  // be missing) -- a missing file is cached as null so we don't refetch.
  if (Object.prototype.hasOwnProperty.call(DATA.pressure, code)) return DATA.pressure[code];
  try {
    const res = await fetch('data/pressure/' + code + '.json');
    if (!res.ok){ DATA.pressure[code] = null; return null; }
    DATA.pressure[code] = await res.json();
  } catch (err) {
    DATA.pressure[code] = null;
  }
  return DATA.pressure[code];
}

async function loadTydbDamage(code){
  // Per-storm damage data scraped from 防災科研 TYDB (see
  // scripts/fetch_tydb_damage.py) -- structured prefecture-level table
  // plus a free-text summary. More accurate/complete than the older
  // ranking-derived DAMAGE_INFO (data/damage_storm_codes.json), which
  // only covered the top-204 storms by death toll and sometimes
  // disagreed with TYDB's own numbers. Not every storm has a TYDB page,
  // so a 404/missing file is cached as null.
  if (Object.prototype.hasOwnProperty.call(DATA.tydbDamage, code)) return DATA.tydbDamage[code];
  try {
    const res = await fetch('data/tydb_damage/' + code + '.json');
    if (!res.ok){ DATA.tydbDamage[code] = null; return null; }
    const j = await res.json();
    DATA.tydbDamage[code] = j.notFound ? null : j;
  } catch (err) {
    DATA.tydbDamage[code] = null;
  }
  return DATA.tydbDamage[code];
}

function setEntryVisible(entry, visible){
  // setOpacity(0) alone still leaves the marker hoverable/tooltip-able --
  // it's just invisible. Filtered-out stations should be un-hoverable too,
  // so also toggle pointer-events on the marker's DOM element.
  entry.marker.setOpacity(visible ? 1 : 0);
  const el = entry.marker.getElement();
  if (el) el.style.pointerEvents = visible ? '' : 'none';
}

function buildStationLayer(names, coords, layerArr, prefs){
  // Shared setup for a set of pre-created, initially-hidden station markers
  // (arrow/circle icon swapped per-frame in updateFrame). Used for all three
  // station networks (legacy + AMeDAS wind + AMeDAS rain). prefs (都道府県)
  // is only available for the AMeDAS networks -- the legacy 156-station
  // list has no prefecture data, so it's omitted there.
  names.forEach(function(name, i){
    const coord = coords[i];
    const icon = L.divIcon({
      className:'wind-arrow',
      html: arrowSVG(0, 0, '#666'),
      iconSize:[ARROW_SIZE,ARROW_SIZE],
      iconAnchor:[ARROW_SIZE/2,ARROW_SIZE/2]
    });
    const m = L.marker([coord[0], coord[1]], {icon:icon, interactive:true, opacity:0});
    m.addTo(map);
    m.bindTooltip('', {direction:'top', offset:[0,-ARROW_HALF], sticky:true});
    m.on('mouseover', function(){
      // With many closely-spaced arrow markers, fast cursor movement can
      // occasionally leave a previous marker's tooltip open when the
      // browser coalesces mousemove events and Leaflet's own mouseout
      // doesn't fire cleanly. Defensively close any other open tooltip
      // before this one is shown.
      layerArr.forEach(function(entry){
        if (entry.marker !== m) entry.marker.closeTooltip();
      });
    });
    layerArr.push({marker:m, name:name, pref: prefs ? prefs[i] : ''});
  });

  // Extra safety net: if the cursor leaves the map entirely, make sure no
  // tooltip from this layer is left stuck open.
  map.getContainer().addEventListener('mouseleave', function(){
    layerArr.forEach(function(entry){ entry.marker.closeTooltip(); });
  });
}

function initMap(){
  map = L.map('map', { zoomControl:true, attributionControl:true }).setView([36.2, 138.0], 5);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
    maxZoom: 18, minZoom: 4
  }).addTo(map);
  document.getElementById('map').classList.add('dark-tiles');

  trackPastLine = L.polyline([], {color:'#f4b45c', weight:2, opacity:.9}).addTo(map);
  trackLine = L.polyline([], {color:'#7fe0ea', weight:2.4, opacity:.9, dashArray:'2,6'}).addTo(map);

  // Wide, invisible line laid over the whole track (past+future) purely to make
  // clicking-to-seek easy — the visible track lines are only 2px wide.
  trackHitLine = L.polyline([], {weight:16, opacity:0, interactive:true}).addTo(map);
  trackHitLine.on('click', onTrackClick);
  trackHitLine.on('mouseover', function(){ map.getContainer().style.cursor = 'pointer'; });
  trackHitLine.on('mouseout', function(){ map.getContainer().style.cursor = ''; });

  // Station arrow/circle markers, pre-created, hidden until data arrives.
  // Three separate networks: legacy 156-station (windLayer, used as a
  // fallback for storms without AMeDAS-network data), and the AMeDAS
  // network split by kind (netWindLayer 976 stations, netRainLayer 1669 --
  // wind and rain don't share the same station list).
  buildStationLayer(DATA.stationNames, DATA.stationCoords, windLayer);
  buildStationLayer(
    DATA.network.wind.map(function(s){ return s.name; }),
    DATA.network.wind.map(function(s){ return [s.lat, s.lon]; }),
    netWindLayer,
    DATA.network.wind.map(function(s){ return s.pref; })
  );
  buildStationLayer(
    DATA.network.rain.map(function(s){ return s.name; }),
    DATA.network.rain.map(function(s){ return [s.lat, s.lon]; }),
    netRainLayer,
    DATA.network.rain.map(function(s){ return s.pref; })
  );

  tyMarker = L.marker([0,0], {
    icon: L.divIcon({className:'ty-mark-wrap', html:'', iconSize:[70,32], iconAnchor:[35,24]}),
    interactive:true, opacity:0
  }).addTo(map);
  tyMarker.bindTooltip('', {permanent:false, direction:'top'});

  isobarLayer = L.layerGroup().addTo(map);
}

const ARROW_SIZE = 96; // px, marker bounding box -- much larger than the glyph itself so hovering near (not just exactly on) a station still shows its tooltip
const ARROW_HALF = ARROW_SIZE/2;

function arrowSVG(deg, speed, color, box){
  // deg: direction the wind blows TOWARD (0 = up/north). The glyph points
  // right (east) by default, so it needs an extra -90deg to point up at deg=0.
  // box: svg width/height in px -- ARROW_SIZE for map markers (its extra
  // margin is what makes hovering near a station forgiving), but callers
  // like the legend pass a small fixed box instead so rows stay compact.
  box = box || ARROW_SIZE;
  const half = box / 2;
  const size = 16 + Math.min(speed, 30) * 0.55;
  return '<svg width="' + box + '" height="' + box + '" viewBox="-' + half + ' -' + half + ' ' + box + ' ' + box + '" style="overflow:visible;transform:rotate(' + (deg - 90) + 'deg);">' +
    '<text x="0" y="0" font-size="' + size + '" fill="' + color + '" text-anchor="middle" dominant-baseline="central">➤</text>' +
    '</svg>';
}

function speedColor(spd){
  // JMA official wind-speed color scale.
  if (spd < 5) return '#a0d2ff';
  if (spd < 10) return '#0041ff';
  if (spd < 15) return '#faf500';
  if (spd < 20) return '#ff9900';
  if (spd < 25) return '#ff2800';
  return '#b40068';
}

function rainColor(mm){
  // JMA official precipitation-intensity color scale. Exactly-zero
  // (measured, no rain) gets a dim neutral color -- markers at 0mm/h are
  // never actually shown (see renderObsLayer), but the color is kept
  // around as a harmless fallback.
  if (mm <= 0) return '#3a4a5a';
  if (mm < 1) return '#f2f2ff';
  if (mm < 5) return '#a0d2ff';
  if (mm < 10) return '#218cff';
  if (mm < 20) return '#0041ff';
  if (mm < 30) return '#faf500';
  if (mm < 50) return '#ff9900';
  if (mm < 80) return '#ff2800';
  return '#b40068';
}

function rainCircleSVG(mm, color, box){
  // Fixed radius regardless of mm -- only color encodes intensity.
  // box: see arrowSVG's box param.
  box = box || ARROW_SIZE;
  const half = box / 2;
  const r = 6;
  return '<svg width="' + box + '" height="' + box + '" viewBox="-' + half + ' -' + half + ' ' + box + ' ' + box + '">' +
    '<circle cx="0" cy="0" r="' + r + '" fill="' + color + '" fill-opacity="0.8" stroke="' + color + '" stroke-width="1"/>' +
    '</svg>';
}

function marchingSquares(grid, lat, lon, level){
  // Classic marching squares over a lat/lon grid of scalar values, returning
  // a flat array of 2-point line segments (each [[lat,lon],[lat,lon]]) that
  // approximate the `level` contour. Saddle cases (5, 10) are resolved with
  // a fixed (non-disambiguated) pairing -- fine for isobar drawing, where a
  // locally "wrong" saddle split is visually indistinguishable.
  const segs = [];
  const nLat = grid.length, nLon = grid[0].length;
  function frac(v1, v2){ return v2 === v1 ? 0.5 : (level - v1) / (v2 - v1); }
  for (let i = 0; i < nLat - 1; i++){
    for (let j = 0; j < nLon - 1; j++){
      const tl = grid[i][j], tr = grid[i][j+1], br = grid[i+1][j+1], bl = grid[i+1][j];
      let idx = 0;
      if (tl > level) idx |= 8;
      if (tr > level) idx |= 4;
      if (br > level) idx |= 2;
      if (bl > level) idx |= 1;
      if (idx === 0 || idx === 15) continue;

      const latT = lat[i], latB = lat[i+1], lonL = lon[j], lonR = lon[j+1];
      const top    = [latT, lonL + (lonR - lonL) * frac(tl, tr)];
      const right  = [latT + (latB - latT) * frac(tr, br), lonR];
      const bottom = [latB, lonL + (lonR - lonL) * frac(bl, br)];
      const left   = [latT + (latB - latT) * frac(tl, bl), lonL];

      const CASES = {
        1:[[left,bottom]], 2:[[bottom,right]], 3:[[left,right]],
        4:[[top,right]], 5:[[left,top],[bottom,right]], 6:[[top,bottom]],
        7:[[left,top]], 8:[[top,left]], 9:[[top,bottom]],
        10:[[top,right],[left,bottom]], 11:[[top,right]],
        12:[[left,right]], 13:[[bottom,right]], 14:[[left,bottom]]
      };
      CASES[idx].forEach(function(seg){ segs.push(seg); });
    }
  }
  return segs;
}

const PRESSURE_INTERVAL_HPA = 4;
const PRESSURE_SMOOTH_PASSES = 3; // raw JRA-3Q grid is coarse (stride-2 downsampled); smooth before contouring so lines aren't jagged

function smoothGrid(grid, passes){
  // Repeated 3x3 box blur (edge cells average over however many neighbors
  // exist). Cheap and sufficient to round off the grid-cell jaggedness that
  // marching squares would otherwise trace exactly.
  const nLat = grid.length, nLon = grid[0].length;
  let g = grid;
  for (let p = 0; p < passes; p++){
    const out = new Array(nLat);
    for (let i = 0; i < nLat; i++){
      const row = new Array(nLon);
      for (let j = 0; j < nLon; j++){
        let sum = 0, cnt = 0;
        for (let di = -1; di <= 1; di++){
          const ii = i + di;
          if (ii < 0 || ii >= nLat) continue;
          for (let dj = -1; dj <= 1; dj++){
            const jj = j + dj;
            if (jj < 0 || jj >= nLon) continue;
            sum += g[ii][jj];
            cnt++;
          }
        }
        row[j] = sum / cnt;
      }
      out[i] = row;
    }
    g = out;
  }
  return g;
}

function labelPointsForLevel(segs, maxLabels){
  // Isobars for a single typhoon are usually one (or a few) closed loops;
  // rather than fully tracing loop topology, just sample a handful of
  // segment midpoints spread across the array as label anchor points.
  if (!segs.length) return [];
  const n = Math.min(maxLabels, segs.length);
  const step = Math.max(1, Math.floor(segs.length / n));
  const pts = [];
  for (let i = 0; i < segs.length && pts.length < n; i += step){
    const s = segs[i];
    pts.push([(s[0][0] + s[1][0]) / 2, (s[0][1] + s[1][1]) / 2]);
  }
  return pts;
}

function renderPressure(timeMs){
  isobarLayer.clearLayers();
  const pdata = DATA.pressure[currentStormCode];
  if (!pdata || !pdata.times || !pdata.times.length) return;

  let idx = 0, bestDiff = Infinity;
  for (let i = 0; i < pdata.times.length; i++){
    const diff = Math.abs(Date.parse(pdata.times[i]) - timeMs);
    if (diff < bestDiff){ bestDiff = diff; idx = i; }
  }
  const rawGrid = pdata.values[idx];
  if (!rawGrid) return;
  const grid = smoothGrid(rawGrid, PRESSURE_SMOOTH_PASSES);

  let vmin = Infinity, vmax = -Infinity;
  for (let i = 0; i < grid.length; i++){
    for (let j = 0; j < grid[i].length; j++){
      const v = grid[i][j];
      if (v < vmin) vmin = v;
      if (v > vmax) vmax = v;
    }
  }
  const start = Math.ceil(vmin / PRESSURE_INTERVAL_HPA) * PRESSURE_INTERVAL_HPA;
  for (let level = start; level <= vmax; level += PRESSURE_INTERVAL_HPA){
    const segs = marchingSquares(grid, pdata.lat, pdata.lon, level);
    if (!segs.length) continue;
    const major = level % 20 === 0;
    segs.forEach(function(seg){
      L.polyline(seg, {
        color: '#ffffff',
        weight: major ? 2 : 1,
        opacity: major ? .95 : .6
      }).addTo(isobarLayer);
    });
    // Number the isobar so users can tell highs from lows -- label every
    // level, but only a couple of anchor points per level to avoid clutter.
    labelPointsForLevel(segs, major ? 2 : 1).forEach(function(pt){
      L.marker(pt, {
        icon: L.divIcon({
          className: 'isobar-label',
          html: String(level),
          iconSize: [30, 14],
          iconAnchor: [15, 7]
        }),
        interactive: false
      }).addTo(isobarLayer);
    });
  }
}

const LEGEND_ICON_BOX = 22; // small fixed icon box for legend rows, independent of ARROW_SIZE (the map markers' larger hover hit-box)

function buildLegend(){

    ];
    stops.forEach(function(s){
      const jma = s[2] ? '<span class="jma-label">' + s[2] + '</span>' : '';

    });
  } else {
    title.textContent = 'Wind Legend / 風の凡例（気象庁の風の強さの階級）';
    const stops = [
      [3, '0-5', ''], [8, '5-10', ''],
      [13,'10-15','やや強い風'], [18,'15-20','強い風'], [23,'20-25','非常に強い風'], [28,'25+','猛烈な風']
    ];
    stops.forEach(function(s){
      const jma = s[2] ? '<span class="jma-label">' + s[2] + '</span>' : '';
      html += '<div class="row">' + arrowSVG(0, s[0], speedColor(s[0]), LEGEND_ICON_BOX) + '<span>' + s[1] + ' m/s</span>' + jma + '</div>';
    });
  }
  // Isobars (JRA-3Q) are overlaid on top of wind/rain markers automatically
  // whenever this storm has pressure data -- no separate mode/toggle.
  const pdata = DATA.pressure[currentStormCode];
  if (pdata && pdata.times && pdata.times.length){
    const swatch = function(color, weight){
      return '<svg width="' + LEGEND_ICON_BOX + '" height="16"><line x1="2" y1="8" x2="' + (LEGEND_ICON_BOX-2) + '" y2="8" stroke="' + color + '" stroke-width="' + weight + '"/></svg>';
    };
    html += '<hr class="rule" style="margin:8px 0;">';
    html += '<div class="row">' + swatch('#ffffff', 2) + '<span>気圧配置 20hPa毎（太線）</span></div>';
    html += '<div class="row">' + swatch('#ffffff', 1) + '<span>気圧配置 4hPa毎（細線）</span></div>';
  }
  el.innerHTML = html;
  updateThresholdControl();
}

const DAMAGE_LABELS = {
  dead_missing: ['死者・行方不明者', '人'],
  dead: ['死者', '人'],
  missing: ['行方不明者', '人'],
  injured: ['負傷者', '人'],
  destroyed: ['全壊', '棟'],
  half_destroyed: ['半壊', '棟'],
  washed_away: ['流失', '棟'],
  burned: ['焼失', '棟'],
  half_burned: ['半焼', '棟'],
  partial_damage: ['一部破損', '棟'],
  flooded_above_floor: ['床上浸水', '棟'],
  flooded_below_floor: ['床下浸水', '棟'],
  non_residential: ['非住家', '棟']
};
// Display order -- casualties first, then structure damage, then flooding.
const DAMAGE_KEY_ORDER = ['dead_missing', 'dead', 'missing', 'injured', 'destroyed',
  'half_destroyed', 'washed_away', 'burned', 'half_burned', 'partial_damage',
  'flooded_above_floor', 'flooded_below_floor', 'non_residential'];

function damageScore(prefRow){
  // Single "how bad was it" number per prefecture, used only to rank/color
  // the choropleth -- not shown as a value, so it's fine to just sum every
  // damage count a storm's table happens to report (categories vary by
  // storm, see HEADER_KEY_MAP in scripts/fetch_tydb_damage.py).
  let sum = 0;
  Object.keys(prefRow).forEach(function(k){
    if (k === 'pref' || k === 'source') return;
    const v = prefRow[k];
    if (typeof v === 'number') sum += v;
  });
  return sum;
}

// Sequential low->high severity scale, independent of the JMA wind/rain
// scales (this is a relative "how bad, compared to this storm's own worst
// prefecture" measure, not an absolute meteorological intensity).
const CHOROPLETH_COLORS = ['#ffe9a8', '#ffbf5f', '#ff8a3d', '#e8482f', '#8f1f3f'];
const CHOROPLETH_NO_DATA = '#2a3542';

function buildChoropleth(prefectures){
  if (!PREFECTURES_GEO || !prefectures || !prefectures.length) return '';
  const scoreByPref = {};
  let maxScore = 0;
  prefectures.forEach(function(row){
    const score = damageScore(row);
    scoreByPref[row.pref] = score;
    if (score > maxScore) maxScore = score;
  });
  if (maxScore <= 0) return '';

  let paths = '';
  PREFECTURES_GEO.forEach(function(p){
    const score = scoreByPref[p.kanji] || 0;
    let color = CHOROPLETH_NO_DATA;
    if (score > 0){
      const idx = Math.min(CHOROPLETH_COLORS.length - 1, Math.floor((score / maxScore) * CHOROPLETH_COLORS.length));
      color = CHOROPLETH_COLORS[idx];
    }
    const label = p.kanji + '：' + (score > 0 ? score.toLocaleString('ja-JP') : '被害報告なし');
    paths += '<path d="' + p.path + '" fill="' + color + '" stroke="#0a1420" stroke-width="0.7">' +
      '<title>' + label + '</title></path>';
  });
  return '<div class="pref-map"><svg viewBox="200 0 600 650">' + paths + '</svg>' +
    '<div class="pref-map-legend">薄い色ほど被害小・濃い色ほど被害大（この台風内での相対比較）</div></div>';
}

async function updateDamageInfo(code){
  const el = document.getElementById('damage-info');
  const myToken = selectToken; // abandon this render if a newer storm was selected meanwhile
  const tydb = await loadTydbDamage(code);
  if (myToken !== selectToken) return;

  if (tydb && tydb.total){
    const total = tydb.total;
    const rows = DAMAGE_KEY_ORDER
      .filter(function(k){ return total[k] !== null && total[k] !== undefined; })
      .map(function(k){ return [DAMAGE_LABELS[k][0], total[k], DAMAGE_LABELS[k][1]]; });
    if (!rows.length){
      el.style.display = 'none';
      return;
    }
    let html = '<div class="title">被害状況（防災科研 TYDB, 全国）</div>';
    rows.forEach(function(r){
      html += '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' +
        Number(r[1]).toLocaleString('ja-JP') + ' ' + r[2] + '</span></div>';
    });
    html += buildChoropleth(tydb.prefectures);
    if (tydb.weatherText){
      // The free-text summary occasionally mentions a category the
      // structured table doesn't break out (e.g. 焼失 for some storms), so
      // it's kept -- collapsed by default since it's long and the numbers
      // above already cover most of what people look for at a glance.
      html += '<details class="note"><summary>気象の状況（要約文）</summary>' + tydb.weatherText + '</details>';
    }
    el.innerHTML = html;
    el.style.display = '';
    return;
  }

  // Fall back to the older ranking-derived figures (data/damage_storm_codes.json)
  // for the few storms TYDB doesn't have a page/table for.
  const d = DAMAGE_INFO[code];
  if (!d){
    el.style.display = 'none';
    return;
  }
  const rows = [
    ['死者・行方不明者', d.deadOrMissing, '人'],
    ['負傷者', d.injured, '人'],
    ['住家被害', d.houseDamage, '棟'],
    ['浸水被害', d.floodDamage, '棟'],
    ['被害額', d.costOkuYen, '億円']
  ].filter(function(r){ return r[1] !== null && r[1] !== undefined; });
  if (!rows.length){
    el.style.display = 'none';
    return;
  }
  let html = '<div class="title">被害状況（デジタル台風 災害DB, 全国）</div>';
  rows.forEach(function(r){
    html += '<div class="row"><span class="k">' + r[0] + '</span><span class="v">' +
      Number(r[1]).toLocaleString('ja-JP') + ' ' + r[2] + '</span></div>';
  });
  el.innerHTML = html;
  el.style.display = '';
}

function updateThresholdControl(){

  const valueEl = document.getElementById('threshold-value');

  const unit = displayMode === 'rain' ? 'mm/h' : 'm/s';

let ACTIVE_ORDER = []; // STORM_ORDER filtered down by the current filter panel state
let selectedYear = null; // year currently chosen in the year dropdown

function currentFilters(){
  return {
    landfallOnly: document.getElementById('f-landfall').checked
  };
}

function applyFilters(){
  const f = currentFilters();
  ACTIVE_ORDER = STORM_ORDER.filter(function(code){
    const s = STORM_META[code];
    if (f.landfallOnly && !s.landfallJP && !s.damaging) return false;
    return true;
  });
  document.getElementById('filter-count').textContent = ACTIVE_ORDER.length + ' / ' + STORM_ORDER.length + ' 件';
  updateHeaderSub();
  buildYearSelect();
  document.getElementById('year-select').value = selectedYear || '';
  if (selectedYear) buildStormSelect(selectedYear);
  // Only auto-reselect when a storm was already showing and the filter
  // change dropped it (e.g. narrowing to landfall-only storms it isn't
  // one of) -- never auto-pick one on first load, since nothing should be
  // shown until the year/storm dropdowns are used. Prefer a replacement
  // storm from the year that was already selected, so toggling the filter
  // doesn't jump the user to a different year (e.g. the first landfall
  // storm overall, back in 1951); only fall back to the first active storm
  // in any year if the current year has none left.
  if (currentStormCode && ACTIVE_ORDER.length && !ACTIVE_ORDER.includes(currentStormCode)){
    const sameYear = selectedYear ? ACTIVE_ORDER.filter(function(code){ return STORM_META[code].year === selectedYear; }) : [];
    selectStorm(sameYear.length ? sameYear[0] : ACTIVE_ORDER[0]);
  } else if (!ACTIVE_ORDER.length) {
    document.getElementById('side-name-ja').textContent = '該当する台風がありません';
    document.getElementById('side-name-en').textContent = '';
  }
}

function wireFilterPanel(){
  document.getElementById('f-landfall').addEventListener('change', applyFilters);
}

function updateHeaderSub(){
  const yrs = ACTIVE_ORDER.length;
  const first = STORM_ORDER.length ? STORM_META[STORM_ORDER[0]].year : '';
  const last = STORM_ORDER.length ? STORM_META[STORM_ORDER[STORM_ORDER.length-1]].year : '';
  document.getElementById('header-sub').textContent =
    first + '–' + last + '年 上陸台風(' + yrs + '/' + STORM_ORDER.length + '個表示中) — 地上風観測データ';
}

function buildYearSelect(){
  const sel = document.getElementById('year-select');
  const activeSet = new Set(ACTIVE_ORDER);
  const years = [];
  const seen = new Set();
  STORM_ORDER.forEach(function(code){
    const y = STORM_META[code].year;
    if (!seen.has(y)){ seen.add(y); years.push(y); }
  });
  years.sort();

  sel.innerHTML = '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = '年を選択';
  sel.appendChild(placeholder);
  years.forEach(function(y){
    const hasActive = STORM_ORDER.some(function(code){
      return STORM_META[code].year === y && activeSet.has(code);
    });
    const opt = document.createElement('option');
    opt.value = y;
    const era = japaneseEra(y);
    opt.textContent = y + '年' + (era ? '（' + era + '年）' : '');
    opt.disabled = !hasActive;
    sel.appendChild(opt);
  });
  sel.value = (selectedYear && years.includes(selectedYear)) ? selectedYear : '';
}

function selectYear(y){
  selectedYear = y;
  document.getElementById('year-select').value = y || '';
  if (y) buildStormSelect(y);
  else {
    const stormSel = document.getElementById('storm-select');
    stormSel.style.display = 'none';
    stormSel.innerHTML = '';
  }
}

function buildStormSelect(y){
  const sel = document.getElementById('storm-select');
  sel.innerHTML = '';
  const codes = ACTIVE_ORDER.filter(function(code){ return STORM_META[code].year === y; });
  if (!codes.length){
    const opt = document.createElement('option');
    opt.textContent = 'この年に該当する台風がありません';
    sel.appendChild(opt);
    sel.style.display = '';
    return;
  }
  codes.forEach(function(code){
    const s = STORM_META[code];
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = parseInt(code.slice(2), 10) + '号 ' + (s.name || '(NONAME)') +
      (s.officialName ? '(' + s.officialName + ')' : '');
    sel.appendChild(opt);
  });
  sel.value = codes.includes(currentStormCode) ? currentStormCode : codes[0];
  sel.style.display = '';
}


async function selectStorm(code){
  const myToken = ++selectToken;
  currentStormCode = code;
  currentIdx = 0;
  if (playing) pause();

  // Keep the year/storm dropdowns in sync (covers dropdown selections,
  // filter changes that jump to a different storm, and the initial
  // auto-selected storm on page load).
  const meta0 = STORM_META[code] || {};
  if (meta0.year !== selectedYear){
    selectYear(meta0.year);
  }
  document.getElementById('storm-select').value = code;

  // Lightweight loading state while this storm's track/wind payload is
  // fetched (name/year are already known from the index, so show those
  // immediately rather than leaving the panel blank).
  const meta = STORM_META[code] || {};
  document.getElementById('side-name-ja').textContent = '\u53f0\u98a8 ' + (meta.name || '(\u540d\u79f0\u4e0d\u660e)') + ' \u8aad\u307f\u8fbc\u307f\u4e2d\u2026';
  document.getElementById('side-name-en').textContent = code;
  document.getElementById('slider').disabled = true;
  document.getElementById('play-btn').disabled = true;

  let s;
  try {
    s = await loadStorm(code);
  } catch (err) {
    if (myToken !== selectToken) return;
    document.getElementById('side-name-ja').textContent = '\u8aad\u307f\u8fbc\u307f\u306b\u5931\u6557\u3057\u307e\u3057\u305f';
    document.getElementById('side-name-en').textContent = String(err.message || err);
    return;
  }
  if (myToken !== selectToken) return; // a newer selection has since started; drop this stale result

  document.getElementById('slider').disabled = false;
  document.getElementById('play-btn').disabled = false;

  // AMeDAS-network wind/rain (data/storms_obs/<code>_{wind,rain}.json) takes
  // priority over the legacy 156-station data embedded in the storm file
  // when present; fetched here (not lazily on mode switch) since it also
  // determines whether the wind/rain buttons should be enabled at all.
  let obsNet = null;
  try { obsNet = await loadStormObsNetwork(code); } catch (err) { obsNet = null; }
  if (myToken !== selectToken) return;

  // Check per-mode data availability by actual content, not just whether
  // the obsNet field exists -- see dataHasAnyValue()'s comment.
  const windSrc = currentObsSource(s, obsNet, 'wind');
  const rainSrc = currentObsSource(s, obsNet, 'rain');
  modeHasData.wind = dataHasAnyValue(windSrc && windSrc.data);
  modeHasData.rain = dataHasAnyValue(rainSrc && rainSrc.data);
  const hasObs = modeHasData.wind || modeHasData.rain;
  ranking.wind = modeHasData.wind ? computeRanking(windSrc.layer, windSrc.data, 'wind') : [];
  ranking.rain = modeHasData.rain ? computeRanking(rainSrc.layer, rainSrc.data, 'rain') : [];

  // Only offer a mode that actually has data -- e.g. pre-1961 storms have
  // rain records but no digitized wind readings at all. If the mode
  // currently showing just lost its data, fall back to the other one.
  document.querySelectorAll('.mode-btn').forEach(function(b){
    const m = b.dataset.mode;
    b.disabled = !modeHasData[m];
    b.title = modeHasData[m] ? '' : 'この台風には' + (m === 'wind' ? '風' : '雨') + 'の観測データはありません。';
  });
  if (!modeHasData[displayMode]){
    const fallback = displayMode === 'wind' ? 'rain' : 'wind';
    if (modeHasData[fallback]){
      displayMode = fallback;
      document.querySelectorAll('.mode-btn').forEach(function(b){
        b.classList.toggle('active', b.dataset.mode === displayMode);
      });
    }
  }

  const tl = activeTimeline(s, obsNet, displayMode);
  activeTimes = tl.times;
  activePlayIdx = tl.playIdx;
  const ih = Math.round(intervalHoursFor(activeTimes, activePlayIdx) * 10) / 10;

  document.getElementById('side-name-ja').textContent = '台風 ' + (s.name || '(名称不明)') + (hasObs ? '' : '（観測データなし・経路のみ）');
  document.getElementById('side-name-en').textContent = code + ' / ' + s.track.length + ' track points' + (hasObs ? ', ' + activePlayIdx.length + ' ' + ih + '-hourly steps' : '');
  updateModeNote();
  updateRankingPanel();
  updateDamageInfo(code);
  // Pressure data (JRA-3Q) is fetched regardless of mode: whenever this
  // storm has it, isobars are automatically overlaid on the wind/rain
  // markers (see buildLegend/updateFrame).
  await loadPressureData(code);
  buildLegend();

  const slider = document.getElementById('slider');
  slider.max = activePlayIdx.length - 1;
  slider.value = 0;

  buildTicks(activePlayIdx.map(function(i){ return activeTimes[i]; }));

  // Fit map to track bounds
  const bounds = s.track.map(function(p){ return [p.lat, p.lon]; });
  if (bounds.length) map.fitBounds(bounds, {padding:[40,40]});
  trackHitLine.setLatLngs(bounds);

  updateFrame(0);
}

function buildTicks(times){
  const el = document.getElementById('ticklabels');
  el.innerHTML = '';
  const n = times.length;
  const marks = 6;
  for (let i=0;i<marks;i++){
    const idx = Math.round(i*(n-1)/(marks-1));
    const d = new Date(times[idx]);
    const span = document.createElement('span');
    span.textContent = (d.getMonth()+1) + '/' + d.getDate();
    el.appendChild(span);
  }
}

function trackTimeMs(iso){
  // bst_landfall_only.txt (best track) timestamps are recorded in UTC
  // ("Z time"), while the wind observation timestamps (s.times) are JST
  // ("I time"). Rather than rewriting the source data, convert here at the
  // point of use: +9h puts track times on the same JST axis as s.times.
  return Date.parse(iso) + 9*3600*1000;
}

function isoLocal(d){
  // Format a Date using LOCAL getters (not toISOString(), which uses UTC
  // getters). Every timestamp string elsewhere in this file has no timezone
  // designator and is parsed as the browser's local time (see the long
  // comment in loadStorm()), so any string built from a Date must use local
  // getters too or it'll silently disagree with everything else by the
  // viewer's UTC offset.
  function p2(n){ return String(n).padStart(2, '0'); }
  return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()) +
    'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
}

function getObsIndices(s){
  // Wind observations normally exist every 3 hours even though `times` is hourly.
  // Find every time-index that has a real multi-station reading, so playback/
  // slider steps land on the storm's actual observation cadence.
  //
  // Some storms (e.g. 1989) have one or a few stations (伊吹山 etc.) that report
  // hourly during landfall while most other stations still report 3-hourly.
  // Counting "any station has data" would then wrongly treat every hour as an
  // observation step. Instead we count how many stations report at each
  // time-index and only keep indices where at least half of that storm's peak
  // station count reported, since a real synoptic observation time is reported
  // by (nearly) all stations at once, whereas a handful of off-cadence stations
  // only ever contribute a small fraction of the peak count.
  if (s._obsIdx) return s._obsIdx;
  if (!s.wind || !s.wind.length){
    // Track-only storm: every synthesized time-index is a real track point.
    s._obsIdx = s.times.map(function(_, i){ return i; });
    return s._obsIdx;
  }
  const n = s.times.length;
  const counts = new Array(n).fill(0);
  for (let si=0; si<s.wind.length; si++){
    const arr = s.wind[si];
    for (let i=0;i<n;i++){
      if (arr[i] !== null && arr[i] !== undefined) counts[i]++;
    }
  }
  const maxCount = Math.max.apply(null, counts);
  const threshold = Math.max(2, Math.round(maxCount * 0.5));
  const idxs = [];
  for (let i=0;i<n;i++) if (counts[i] >= threshold) idxs.push(i);
  s._obsIdx = idxs.length ? idxs : [0];
  return s._obsIdx;
}

function intervalHoursFor(times, playIdx){
  // Median gap (in hours) between consecutive playable observation steps.
  // Used to scale playback speed so 1-hourly storms don't feel sluggish next
  // to 3-hourly ones (see play()).
  if (playIdx.length < 2) return 3;
  const gaps = [];
  for (let i=1;i<playIdx.length;i++){
    const dt = (Date.parse(times[playIdx[i]]) - Date.parse(times[playIdx[i-1]])) / 3600000;
    if (dt > 0) gaps.push(dt);
  }
  gaps.sort(function(a,b){ return a-b; });
  return gaps.length ? gaps[Math.floor(gaps.length/2)] : 3;
}

function getPlayableIndices(s){
  // Trim the 3-hourly observation indices to the storm's track lifetime,
  // so the timeline's left edge lines up with the track's first point and
  // the right edge lines up with the track's last point (wind observations
  // exist before the storm has formed and keep coming every 3h after it has
  // dissipated/left the track data, but we don't want to play through those).
  if (s._playIdx) return s._playIdx;
  const obsIdx = getObsIndices(s);
  const trackStartMs = trackTimeMs(s.track[0].time);
  const trackEndMs = trackTimeMs(s.track[s.track.length-1].time);
  const playable = obsIdx.filter(function(i){
    const t = Date.parse(s.times[i]);
    return t >= trackStartMs && t <= trackEndMs;
  });
  s._playIdx = playable.length ? playable : obsIdx.slice(0,1);
  return s._playIdx;
}

function denseIndices(times, values){
  // The network files always request hourly slots from JMA's API, but
  // older eras (e.g. the 1970s) only actually reported every 3 hours --
  // the in-between hourly slots are null for every single station, not
  // just sparse. Counting "any station has data" would treat every hour
  // as a real observation step and the timeline would blink between a
  // real 3-hourly frame and two empty ones. Instead, same heuristic as
  // the legacy getObsIndices(): count how many stations report at each
  // time-index and keep only indices at/above half that storm's peak
  // station count, since a real observation time is reported by
  // (nearly) all stations at once.
  const n = times.length;
  const counts = new Array(n).fill(0);
  for (let i = 0; i < values.length; i++){
    const station = values[i];
    if (!station) continue;
    for (let t = 0; t < n; t++){
      if (station[t] !== null && station[t] !== undefined) counts[t]++;
    }
  }
  const peak = Math.max.apply(null, counts);
  if (peak === 0) return [];
  const threshold = peak / 2;
  const idxs = [];
  for (let i = 0; i < n; i++) if (counts[i] >= threshold) idxs.push(i);
  return idxs;
}

function computeNetworkPlayIndices(times, values, s){
  const trackStartMs = trackTimeMs(s.track[0].time);
  const trackEndMs = trackTimeMs(s.track[s.track.length-1].time);
  const dense = denseIndices(times, values);
  const candidates = dense.length ? dense : times.map(function(_, i){ return i; });
  const idx = candidates.filter(function(i){
    const t = Date.parse(times[i]);
    return t >= trackStartMs && t <= trackEndMs;
  });
  return idx.length ? idx : candidates.slice(0, 1);
}

function activeTimeline(s, obsNet, mode){
  // The AMeDAS-network files (data/storms_obs/*) carry a times axis at
  // the real observation cadence for most (modern, hourly) storms --
  // prefer that over the legacy synthesized-from-track cadence, which for
  // pre-1990s storms can be as coarse as 6-hourly (JMA's best-track
  // resolution back then). computeNetworkPlayIndices additionally filters
  // out hourly slots that aren't real observations (see denseIndices()).
  const net = obsNet && obsNet[mode];
  if (net && net.times && net.times.length){
    return { times: net.times, playIdx: computeNetworkPlayIndices(net.times, net.values || [], s) };
  }
  return { times: s.times, playIdx: getPlayableIndices(s) };
}

function findTrackAt(track, timeMs){
  // linear interpolation between bracketing points
  let before=null, after=null;
  for (let i=0;i<track.length;i++){
    const t = trackTimeMs(track[i].time);
    if (t<=timeMs) before = track[i];
    if (t>=timeMs && !after) after = track[i];
  }
  if (!before) return after;
  if (!after) return before;
  if (before===after) return before;
  const t0 = trackTimeMs(before.time), t1 = trackTimeMs(after.time);
  const f = t1===t0 ? 0 : (timeMs - t0)/(t1 - t0);
  return {
    lat: before.lat + (after.lat-before.lat)*f,
    lon: before.lon + (after.lon-before.lon)*f,
    pres: Math.round(before.pres + (after.pres-before.pres)*f),
    grade: f < 0.5 ? before.grade : after.grade,
    time: isoLocal(new Date(timeMs))
  };
}

function findNearestTrackPoint(s, latlng){
  // Nearest track vertex to a clicked map point (simple planar distance,
  // good enough at map scale for picking a seek target).
  let best = s.track[0], bestDist = Infinity;
  s.track.forEach(function(p){
    const dLat = p.lat - latlng.lat, dLon = p.lon - latlng.lng;
    const d = dLat*dLat + dLon*dLon;
    if (d < bestDist){ bestDist = d; best = p; }
  });
  return best;
}

function findNearestPlayableIndex(timeMs){
  // Map an arbitrary time to the closest index within the current
  // timeline's playable (slider) index list.
  let bestPos = 0, bestDiff = Infinity;
  activePlayIdx.forEach(function(idx, pos){
    const diff = Math.abs(Date.parse(activeTimes[idx]) - timeMs);
    if (diff < bestDiff){ bestDiff = diff; bestPos = pos; }
  });
  return bestPos;
}

function onTrackClick(e){
  const s = DATA.storms[currentStormCode];
  const tp = findNearestTrackPoint(s, e.latlng);
  const pos = findNearestPlayableIndex(trackTimeMs(tp.time));
  if (playing) pause();
  updateFrame(pos);
}

function updateFrame(pos){
  currentIdx = pos;
  const s = DATA.storms[currentStormCode];
  const idx = activePlayIdx[pos];
  const t = activeTimes[idx];
  const timeMs = Date.parse(t);
  document.getElementById('slider').value = pos;

  const d = new Date(t);
  const label = d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+
    ' ' + String(d.getHours()).padStart(2,'0') + ':00 JST';
  document.getElementById('time-label').textContent = label;
  document.getElementById('v-time').textContent = label;

  // typhoon center (interpolated)
  const tp = findTrackAt(s.track, timeMs);
  if (tp && tp.lat != null){
    const code = gradeCode(tp.grade);
    const presTxt = Number.isFinite(tp.pres) ? Math.round(tp.pres) + 'hPa' : '';
    tyMarker.setLatLng([tp.lat, tp.lon]);
    tyMarker.setIcon(L.divIcon({
      className:'ty-mark-wrap',
      html:'<div class="ty-mark"><span class="ty-pres">' + presTxt + '</span><span class="ty-code">' + code + '</span></div>',
      iconSize:[70,32], iconAnchor:[35,24]
    }));
    tyMarker.setOpacity(1);
    tyMarker.setTooltipContent(s.name + ' ' + presTxt);
    document.getElementById('v-pres').textContent = presTxt || '—';
    document.getElementById('v-grade').textContent = GRADE_LABEL[tp.grade] || tp.grade;
    document.getElementById('v-pos').textContent = tp.lat.toFixed(1) + '°N, ' + tp.lon.toFixed(1) + '°E';
  } else {
    tyMarker.setOpacity(0);
    document.getElementById('v-pres').textContent = '—';
    document.getElementById('v-grade').textContent = '—';
    document.getElementById('v-pos').textContent = '台風域外';
  }

  // track lines: past (solid amber) vs future (dashed gray)
  const pastPts = [], futPts = [];
  s.track.forEach(function(p){
    const pt = [p.lat, p.lon];
    if (trackTimeMs(p.time) <= timeMs) pastPts.push(pt); else futPts.push(pt);
  });
  if (tp && tp.lat!=null) pastPts.push([tp.lat, tp.lon]);
  trackPastLine.setLatLngs(pastPts);
  trackLine.setLatLngs(futPts.length ? [pastPts[pastPts.length-1]].concat(futPts) : []);

  // Hide every station/isobar layer, then show only what the current mode
  // (and, for wind/rain, which network this storm actually has data in)
  // calls for.
  windLayer.forEach(function(entry){ setEntryVisible(entry, false); });
  netWindLayer.forEach(function(entry){ setEntryVisible(entry, false); });
  netRainLayer.forEach(function(entry){ setEntryVisible(entry, false); });
  isobarLayer.clearLayers();

  const obsNet = DATA.obsNet[currentStormCode];
  const src = currentObsSource(s, obsNet, displayMode);
  if (src) renderObsLayer(src.layer, src.data, timeMs, displayMode);
  // Isobars are overlaid automatically whenever this storm has JRA-3Q data
  // (renderPressure() is a no-op if it doesn't).
  renderPressure(timeMs);
}

function currentObsSource(s, obsNet, mode){
  // AMeDAS network data (obsNet.wind/.rain -- {times, values}, values[i][t])
  // takes priority when this storm has it; otherwise fall back to the
  // legacy 156-station data embedded in data/storms/<code>.json, reshaped
  // into the same {times, values} form so both paths share one renderer.
  if (mode === 'wind' && obsNet && obsNet.wind) return { layer: netWindLayer, data: obsNet.wind };
  if (mode === 'rain' && obsNet && obsNet.rain) return { layer: netRainLayer, data: obsNet.rain };
  if (mode === 'wind') return { layer: windLayer, data: { times: s.times, values: s.wind } };
  if (mode === 'rain') return { layer: windLayer, data: { times: s.times, values: s.rain } };
  return null;
}

function dataHasAnyValue(data){
  // A source can exist structurally (obsNet.wind is a real {times,values}
  // object) while every value in it is null -- e.g. pre-1961 storms, where
  // JMA's network has no digitized wind readings at all even though rain
  // gauge records go back further. Distinguish "no data for this mode"
  // from "all stations currently below threshold/filtered" this way.
  if (!data || !data.values) return false;
  for (let i = 0; i < data.values.length; i++){
    const station = data.values[i];
    if (!station) continue;
    for (let t = 0; t < station.length; t++){
      const v = station[t];
      if (v !== null && v !== undefined) return true;
    }
  }
  return false;
}

function japaneseEra(year){
  // Calendar-year granularity only (no month), which is fine here since
  // every use is a typhoon-season year label, not an exact date -- the
  // only two years where the Gregorian/era boundary actually falls
  // mid-year (1989, 2019) both have their typhoon season entirely on the
  // later era's side anyway.
  const y = parseInt(year, 10);
  if (!Number.isFinite(y)) return null;
  const eras = [[2019,'令和'],[1989,'平成'],[1926,'昭和'],[1912,'大正'],[1868,'明治']];
  for (let i = 0; i < eras.length; i++){
    const start = eras[i][0], name = eras[i][1];
    if (y >= start){
      const n = y - start + 1;
      return name + (n === 1 ? '元' : n);
    }
  }
  return null;
}

function formatDateTime(iso){
  // No year -- used only in the ranking panel, where every row is from
  // the same (already-selected) storm/year, so it'd just be noise.
  const d = new Date(iso);
  return String(d.getMonth()+1).padStart(2,'0') + '/' + String(d.getDate()).padStart(2,'0') +
    ' ' + String(d.getHours()).padStart(2,'0') + ':00';
}

function computeRanking(layer, data, mode){
  // Top-10 by raw value across every station and every timestep in the
  // storm's whole observation period -- independent of the current
  // min-value filter or timeline position, since this is a summary of
  // the whole event, not the current frame.
  if (!layer || !data || !data.values) return [];
  const top = []; // kept sorted descending, length <= 10
  for (let i = 0; i < layer.length; i++){
    const station = data.values[i];
    if (!station) continue;
    for (let t = 0; t < station.length; t++){
      let v = station[t];
      if (v === null || v === undefined) continue;
      if (mode === 'wind'){
        v = v[0]; // [speed, dirFrom]
        if (v === null || v === undefined) continue;
      } else if (v <= 0){
        continue; // 0mm/h baseline isn't interesting for a "biggest rain" ranking
      }
      if (top.length < 10 || v > top[top.length-1].value){
        let idx = top.length;
        while (idx > 0 && top[idx-1].value < v) idx--;
        top.splice(idx, 0, { name: layer[i].name, pref: layer[i].pref || '', time: data.times[t], value: v });
        if (top.length > 10) top.length = 10;
      }
    }
  }
  return top;
}

function updateRankingPanel(){
  const panel = document.getElementById('ranking-panel');
  const list = ranking[displayMode];
  if (!list || !list.length){
    panel.style.display = 'none';
    return;
  }
  panel.style.display = '';
  const unit = displayMode === 'rain' ? 'mm/h' : 'm/s';
  const title = displayMode === 'rain' ? '雨量ランキング TOP10' : '風速ランキング TOP10';
  let html = '<div class="section-label">' + title + '</div><table class="ranking-table"><tbody>';
  list.forEach(function(row, i){
    html += '<tr><td class="rank">' + (i+1) + '</td>' +
      '<td class="name">' + row.name + (row.pref ? '<span class="pref">' + row.pref + '</span>' : '') + '</td>' +
      '<td class="val">' + row.value.toFixed(1) + ' ' + unit + '</td>' +
      '<td class="time">' + formatDateTime(row.time) + '</td></tr>';
  });
  html += '</tbody></table>';
  panel.innerHTML = html;
}

function renderObsLayer(layer, data, timeMs, mode){
  if (!data.times || !data.times.length) return;
  let idx = 0, bestDiff = Infinity;
  for (let i = 0; i < data.times.length; i++){
    const diff = Math.abs(Date.parse(data.times[i]) - timeMs);
    if (diff < bestDiff){ bestDiff = diff; idx = i; }
  }
  const threshold = displayThreshold[mode] || 0;

  for (let i = 0; i < layer.length; i++){
    const entry = layer[i];
    const stationValues = data.values ? data.values[i] : null;
    const v = stationValues ? stationValues[idx] : null;

    if (mode === 'rain'){
      const mm = v;
      // 0mm/h (measured no rain) is never worth showing as a marker, regardless
      // of the min-value filter -- it's the baseline, not a data point of interest.
      if (mm === null || mm === undefined || mm <= 0 || mm < threshold){
        setEntryVisible(entry, false);
        continue;
      }
      setEntryVisible(entry, true);
      const color = rainColor(mm);
      entry.marker.setIcon(L.divIcon({className:'wind-arrow', html:rainCircleSVG(mm, color), iconSize:[ARROW_SIZE,ARROW_SIZE], iconAnchor:[ARROW_SIZE/2,ARROW_SIZE/2]}));
      entry.marker.setTooltipContent(entry.name + '<br>' + mm.toFixed(1) + ' mm/h');
      // Where markers overlap, the more intense (hotter-colored) one should
      // draw on top -- e.g. an orange 40mm/h dot shouldn't be hidden behind
      // a pale blue 2mm/h dot just because it happens to render first.
      entry.marker.setZIndexOffset(Math.round(mm * 10));
      continue;
    }

    const w = v;
    if (!w || w[0] < threshold){
      setEntryVisible(entry, false);
      continue;
    }
    const spd = w[0], dirFrom = w[1];
    setEntryVisible(entry, true);
    let html, tip;
    if (dirFrom === null){
      // Calm, or direction not recorded -- no direction to point, but still
      // color by speed like every other marker rather than a fixed color.
      html = '<svg width="' + ARROW_SIZE + '" height="' + ARROW_SIZE + '" viewBox="-' + ARROW_HALF + ' -' + ARROW_HALF + ' ' + ARROW_SIZE + ' ' + ARROW_SIZE + '"><circle cx="0" cy="0" r="5" fill="' + speedColor(spd) + '"/></svg>';
      tip = entry.name + '<br>' + spd.toFixed(1) + ' m/s (\u9759\u7a4f)';
    } else {
      const toward = (dirFrom + 180) % 360;
      html = arrowSVG(toward, spd, speedColor(spd));
      tip = entry.name + '<br>' + spd.toFixed(1) + ' m/s';
    }
    entry.marker.setIcon(L.divIcon({className:'wind-arrow', html:html, iconSize:[ARROW_SIZE,ARROW_SIZE], iconAnchor:[ARROW_SIZE/2,ARROW_SIZE/2]}));
    entry.marker.setTooltipContent(tip);
    // Same idea as rain: stronger wind draws on top of weaker wind where
    // markers overlap, so a 30m/s red arrow doesn't get buried under a
    // 3m/s blue one.
    entry.marker.setZIndexOffset(Math.round(spd * 10));
  }
}

function step(){
  const next = currentIdx + 1;
  if (next >= activePlayIdx.length){
    pause();
    return;
  }
  updateFrame(next);
}

function play(){
  playing = true;
  document.getElementById('play-btn').innerHTML = '&#10074;&#10074;';
  let speed = parseInt(document.getElementById('speed-select').value, 10);
  // Each step of a 1-hourly storm advances the typhoon 1/3 as much real time as
  // a step of a 3-hourly storm, so at the same frame delay it looks 3x slower.
  // Play 1-hourly storms at 3x the frame rate to match the apparent pace.
  if (intervalHoursFor(activeTimes, activePlayIdx) <= 1.5) speed = speed / 3;
  playTimer = setInterval(step, speed);
}
function pause(){
  playing = false;
  document.getElementById('play-btn').innerHTML = '&#9654;';
  clearInterval(playTimer);
}

document.addEventListener('DOMContentLoaded', function(){
  Promise.all([loadStations(), loadIndex(), loadNetworkStations(), loadDamageInfo(), loadPrefecturesGeo()]).then(function(){
    STORM_ORDER = computeStormOrder();

    initMap();
    buildLegend();
    wireFilterPanel();
    applyFilters(); // builds ACTIVE_ORDER/year list from the default filter state and selects the first match

    // Default landing view: 2025's Typhoon 23 (NAKRI), if it's in the
    // (default-checked) filtered set.
    selectYear('2025');
    if (ACTIVE_ORDER.includes('2523')) selectStorm('2523');

    document.getElementById('year-select').addEventListener('change', function(e){
      selectYear(e.target.value || null);
      const codes = ACTIVE_ORDER.filter(function(code){ return STORM_META[code].year === selectedYear; });
      if (codes.length) selectStorm(codes[0]);
    });
    document.getElementById('storm-select').addEventListener('change', function(e){
      if (e.target.value) selectStorm(e.target.value);
    });

    document.querySelectorAll('.mode-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        const mode = btn.dataset.mode;
        if (mode === displayMode) return;
        displayMode = mode;
        document.querySelectorAll('.mode-btn').forEach(function(b){
          b.classList.toggle('active', b.dataset.mode === mode);
        });
        buildLegend();
        updateModeNote();
        updateRankingPanel();
        const s = DATA.storms[currentStormCode];
        if (currentStormCode && s){
          // Wind and rain can have different observation cadences (e.g. one
          // network file hourly, the other synthesized from a coarser
          // legacy source), so the timeline needs rebuilding on every mode
          // switch, not just on storm change. Keep the same wall-clock
          // time position across the switch rather than resetting to 0.
          const prevTimeMs = activeTimes.length ? Date.parse(activeTimes[activePlayIdx[currentIdx]]) : null;
          const obsNet = DATA.obsNet[currentStormCode];
          const tl = activeTimeline(s, obsNet, displayMode);
          activeTimes = tl.times;
          activePlayIdx = tl.playIdx;
          document.getElementById('slider').max = activePlayIdx.length - 1;
          buildTicks(activePlayIdx.map(function(i){ return activeTimes[i]; }));
          updateFrame(prevTimeMs !== null ? findNearestPlayableIndex(prevTimeMs) : 0);
        }
      });
    });

    document.getElementById('threshold-slider').addEventListener('input', function(e){
      displayThreshold[displayMode] = parseInt(e.target.value, 10);
      const unit = displayMode === 'rain' ? 'mm/h' : 'm/s';
      document.getElementById('threshold-value').textContent = e.target.value + ' ' + unit + '以上を表示';
      if (currentStormCode && DATA.storms[currentStormCode]) updateFrame(currentIdx);
    });

    document.getElementById('about-btn').addEventListener('click', function(){
      document.getElementById('about-popover').classList.toggle('open');
    });
    document.addEventListener('click', function(e){
      const popover = document.getElementById('about-popover');
      const btn = document.getElementById('about-btn');
      if (popover.classList.contains('open') && !popover.contains(e.target) && e.target !== btn){
        popover.classList.remove('open');
      }
    });

    document.getElementById('slider').addEventListener('input', function(e){
      if (playing) pause();
      updateFrame(parseInt(e.target.value,10));
    });
    document.getElementById('play-btn').addEventListener('click', function(){
      if (playing) pause(); else play();
    });
    document.getElementById('speed-select').addEventListener('change', function(){
      if (playing){ pause(); play(); }
    });

    document.getElementById('loading-overlay').style.display = 'none';
  }).catch(function(err){
    const el = document.getElementById('loading-overlay');
    el.textContent = 'データの読み込みに失敗しました。ページを再読み込みしてください。(' + err.message + ')';
  });
});
})();
</script>
